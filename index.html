<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 스케줄 보드</title>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#fafafa; --bg-muted:#f4f4f5;
    --border:#e5e7eb; --border-strong:#d4d4d8;
    --text:#18181b; --text-soft:#52525b; --text-muted:#a1a1aa;
    --accent:#2563eb; --accent-soft:#eff6ff;
    --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.04);
    --st-wait:#a1a1aa; --st-progress:#2563eb; --st-done:#16a34a;
    --pr-high:#dc2626; --pr-mid:#d97706; --pr-low:#65a30d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,Arial,sans-serif;
    color:var(--text);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}

  /* 사이드바 레이아웃 */
  .app{display:flex;align-items:flex-start;min-height:100vh;}
  .sidebar{width:208px;flex:none;align-self:stretch;background:var(--bg-soft);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;}
  .side-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:6px 8px 18px;letter-spacing:-.01em;}
  .side-nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;color:var(--text-soft);font-size:13.5px;font-weight:500;padding:9px 10px;border-radius:8px;cursor:pointer;}
  .nav-item:hover{background:var(--bg-muted);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav-item .ni{width:18px;text-align:center;color:var(--text-muted);font-size:13px;}
  .nav-item.active .ni{color:var(--accent);}
  .nav-group{font-size:11px;font-weight:700;color:var(--text-muted);padding:14px 10px 5px;letter-spacing:.02em;}
  .nav-group:first-child{padding-top:2px;}
  .db-frame{width:100%;height:calc(100vh - 132px);border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);display:block;}
  body.db-full header{display:none;}
  body.db-full main{padding:0;max-width:none;margin:0;}
  body.db-full .db-frame{height:100vh;border:none;border-radius:0;}
  .app-main{flex:1;min-width:0;}
  .board-tools{display:inline-flex;align-items:center;gap:8px;}

  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 24px;}
  .header-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto;}
  .brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;outline:none;border-radius:6px;padding:1px 5px;cursor:text;}
  .brand h1:hover{background:var(--bg-muted);}
  .brand h1:focus{background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft);}
  .brand h1.static{cursor:default;}
  .brand h1.static:hover{background:transparent;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .pmeta{font-size:12px;color:var(--text-muted);font-weight:400;margin-left:6px;}
  .plink{font-size:12px;margin-left:8px;color:var(--accent);text-decoration:none;}
  .plink:hover{text-decoration:underline;}
  .plink-edit{font-size:12px;margin-left:6px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:5px;padding:2px 6px;}
  .plink-edit:hover{background:var(--bg-muted);color:var(--text);}
  .pname-edit{border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:5px;padding:1px 5px;font-size:12px;opacity:0;}
  .project-head:hover .pname-edit{opacity:1;}
  .pname-edit:hover{background:var(--bg-muted);color:var(--text);}
  .rp-doc{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap;}
  .rp-doc:hover{text-decoration:underline;}
  .doc-cell{display:inline-flex;align-items:center;gap:6px;}
  .doc-edit{border:none;background:transparent;color:var(--text-muted);font-size:12px;cursor:pointer;border-radius:5px;padding:2px 6px;white-space:nowrap;}
  .doc-edit:hover{background:var(--bg-muted);color:var(--text);}

  /* 상단 툴바 (회사 OS 폼) */
  .toolbar-right{display:flex;align-items:center;gap:8px;}
  .vtab{border:none;background:transparent;color:var(--text-soft);font-size:13px;font-weight:600;padding:7px 10px;border-radius:var(--radius);cursor:pointer;}
  .vtab:hover{background:var(--bg-muted);color:var(--text);}
  .vtab.active{background:var(--accent-soft);color:var(--accent);}
  .pop-wrap{position:relative;display:inline-flex;align-items:center;}
  .icon-tool{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text-soft);width:34px;height:34px;border-radius:var(--radius);cursor:pointer;position:relative;}
  .icon-tool:hover{background:var(--bg-soft);color:var(--text);}
  #more-btn{font-size:18px;line-height:1;}
  .dot-badge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
  .pop-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;min-width:190px;display:none;}
  .pop-menu.open{display:block;}
  .pm-item{display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px;}
  .pm-item:hover{background:var(--bg-soft);}
  .pm-item b{font-weight:600;}
  .pm-item span{font-size:11px;color:var(--text-muted);}
  .pm-item.simple{flex-direction:row;color:var(--text);}
  .pm-filter{min-width:240px;padding:10px;}
  .fm-sec{padding:8px 4px;border-bottom:1px solid var(--border);}
  .fm-sec:last-of-type{border-bottom:none;}
  .fm-title{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
  .fm-radio{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-right:12px;cursor:pointer;padding:3px 0;}
  .fm-select{width:100%;font-size:13px;padding:7px 9px;}
  .fm-foot{padding-top:8px;display:flex;justify-content:flex-end;}
  .search-wrap .search-input{width:0;padding:8px 0;border:none;opacity:0;transition:width .18s, opacity .15s, padding .18s;pointer-events:none;}
  .search-wrap.open .search-input{width:230px;padding:8px 12px;border:1px solid var(--border-strong);opacity:1;pointer-events:auto;border-radius:var(--radius);}
  .search-wrap.open #search-btn{display:none;}
  .sync-status{font-size:12px;color:var(--text-muted);white-space:nowrap;}

  .view-toggle{display:inline-flex;background:var(--bg-muted);border-radius:var(--radius);padding:3px;}
  .view-toggle button{border:none;background:transparent;color:var(--text-soft);padding:6px 16px;border-radius:6px;font-size:13px;font-weight:500;}
  .view-toggle button.active{background:var(--bg);color:var(--text);box-shadow:var(--shadow);}

  .btn{border:1px solid var(--border-strong);background:var(--bg);color:var(--text);padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--bg-soft);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#1d4ed8;}
  .btn-ghost{border-color:transparent;color:var(--text-soft);}
  .btn-ghost:hover{background:var(--bg-muted);}
  .btn-sm{padding:3px 8px;font-size:12px;}

  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;margin-top:12px;}
  select,input[type=text],input[type=date],textarea{font-family:inherit;font-size:13px;color:var(--text);border:1px solid var(--border-strong);border-radius:var(--radius);padding:7px 10px;background:var(--bg);outline:none;}
  select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search{flex:1;min-width:160px;max-width:280px;}
  .filter-label{font-size:12px;color:var(--text-muted);font-weight:500;}

  main{padding:20px 24px 60px;max-width:1500px;margin:0 auto;}

  /* list */
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--text-muted);font-size:12px;}
  .project-group{margin-bottom:22px;}
  .project-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;user-select:none;}
  .project-head .chev{color:var(--text-muted);transition:transform .15s;font-size:11px;width:10px;}
  .project-group.collapsed .chev{transform:rotate(-90deg);}
  .project-head .pname{font-size:15px;font-weight:700;}
  .project-head .pcount{font-size:12px;color:var(--text-muted);background:var(--bg-muted);padding:2px 8px;border-radius:20px;}
  .project-group.collapsed .table-wrap{display:none;}

  .table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:var(--bg-soft);text-align:left;font-weight:600;color:var(--text-soft);padding:9px 12px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap;}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--bg-soft);}
  tbody tr{cursor:pointer;}
  tr.grp td{background:var(--bg-soft);padding:0;}
  tr.grp:hover td{background:var(--bg-soft);}
  .grp-head{display:flex;align-items:center;gap:10px;padding:10px 12px;}
  .grp-head .chev{cursor:pointer;color:var(--text-muted);font-size:11px;display:inline-block;transition:transform .15s;width:10px;}
  tr.grp.collapsed .chev{transform:rotate(-90deg);}
  .grp-head .gname{font-weight:700;font-size:14px;cursor:pointer;}
  tr.grp .pname-edit{opacity:0;}
  tr.grp:hover .pname-edit{opacity:1;}
  tr.empty-row td{padding:11px 12px;color:var(--text-muted);}
  tr.child-row{background:#fcfcfd;}
  tr.child-row td:first-child{color:var(--text-soft);}
  .name-cell{display:flex;align-items:center;gap:6px;min-width:240px;}
  .twisty{width:16px;height:16px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:10px;border-radius:4px;}
  .twisty.has:hover{background:var(--bg-muted);color:var(--text);}
  .twisty.empty{visibility:hidden;}
  .ttext{font-weight:500;}
  tr.child-row .ttext{font-weight:400;}
  .subadd{margin-left:auto;opacity:0;border:none;background:transparent;color:var(--accent);font-size:12px;padding:2px 6px;border-radius:5px;white-space:nowrap;}
  tr:hover .subadd{opacity:1;}
  .subadd:hover{background:var(--accent-soft);}
  .cat,.assignee{color:var(--text-soft);white-space:nowrap;}
  .dates{color:var(--text-soft);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .doc-link{color:var(--accent);text-decoration:none;}
  .doc-link:hover{text-decoration:underline;}
  .muted{color:var(--text-muted);}

  .miniprog{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);white-space:nowrap;}
  .bar{width:46px;height:5px;border-radius:3px;background:var(--bg-muted);overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--st-done);}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .badge .bdot{width:6px;height:6px;border-radius:50%;}
  .st-대기,.st-대기중{background:#f4f4f5;color:#52525b;} .st-대기 .bdot,.st-대기중 .bdot{background:var(--st-wait);}
  .st-진행중{background:var(--accent-soft);color:#1d4ed8;} .st-진행중 .bdot{background:var(--st-progress);}
  .st-완료{background:#dcfce7;color:#15803d;} .st-완료 .bdot{background:var(--st-done);}

  /* status tabs */
  .status-tabs{display:flex;gap:4px;width:100%;margin-top:12px;border-bottom:1px solid var(--border);}
  .status-tabs button{border:none;background:transparent;color:var(--text-soft);font-size:13px;font-weight:500;
    padding:8px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px;}
  .status-tabs button:hover{color:var(--text);}
  .status-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
  .status-tabs .cnt{font-size:11px;color:var(--text-muted);background:var(--bg-muted);padding:0 6px;border-radius:20px;}
  .empty-proj{padding:14px;display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:13px;}

  /* inline editable cells */
  .cell-select,.cell-date{font-family:inherit;font-size:13px;color:var(--text);border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;max-width:150px;cursor:pointer;}
  .cell-select:hover,.cell-date:hover{background:var(--bg-muted);}
  .cell-select:focus,.cell-date:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft);outline:none;}
  .cell-date{color:var(--text-soft);font-variant-numeric:tabular-nums;}
  .name-input{font-family:inherit;font-size:13px;width:100%;border:1px solid var(--accent);border-radius:6px;padding:5px 8px;background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft);outline:none;}
  tr.newrow{background:var(--accent-soft);}
  .ttext{cursor:pointer;} .ttext:hover{text-decoration:underline;text-decoration-color:var(--border-strong);}

  /* assignee multi-select */
  .assignee-cell{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text-soft);border:1px solid transparent;border-radius:6px;padding:3px 6px;cursor:pointer;max-width:160px;}
  .assignee-cell:hover{background:var(--bg-muted);}
  .assignee-cell .caret{color:var(--text-muted);font-size:10px;margin-left:auto;}
  #assignee-pop{position:absolute;z-index:60;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:6px;min-width:150px;display:none;}
  .ap-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer;}
  .ap-item:hover{background:var(--bg-soft);}
  .ap-add{padding:7px 8px;margin-top:4px;border-top:1px solid var(--border);color:var(--accent);font-size:12px;cursor:pointer;border-radius:6px;}
  .ap-add:hover{background:var(--accent-soft);}
  .assignee-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .assignee-box label{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;width:auto;font-size:13px;border:1px solid var(--border-strong);border-radius:20px;padding:4px 12px;cursor:pointer;user-select:none;white-space:nowrap;overflow:visible;}
  .assignee-box label input{flex:none;margin:0;width:14px;height:14px;}
  .assignee-box label span{flex:none;}
  .assignee-box label.on{background:var(--accent-soft);border-color:var(--accent);color:#1d4ed8;}
  .assignee-box label input{margin:0;}
  .assignee-box .addp{font-size:12px;color:var(--accent);cursor:pointer;padding:4px 8px;}

  /* today view */
  .today-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;}
  .today-head h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .today-head .sub{color:var(--text-muted);font-size:13px;}
  .today-stats{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .stat{border:1px solid var(--border);border-radius:8px;padding:9px 16px;min-width:88px;}
  .stat .n{font-size:21px;font-weight:700;line-height:1.1;}
  .stat .l{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .todo-section{margin-bottom:20px;}
  .todo-section h3{font-size:13px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .todo-section h3 .c{font-size:11px;color:var(--text-muted);background:var(--bg-muted);padding:1px 7px;border-radius:20px;}
  .todo-list{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .todo-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);}
  .todo-item:last-child{border-bottom:none;}
  .todo-item:hover{background:var(--bg-soft);}
  .todo-item input[type=checkbox]{width:17px;height:17px;flex:none;cursor:pointer;accent-color:var(--accent);}
  .todo-main{flex:1;min-width:0;}
  .todo-name{font-weight:500;cursor:pointer;}
  .todo-name:hover{text-decoration:underline;}
  .todo-item.done .todo-name{text-decoration:line-through;color:var(--text-muted);}
  .todo-item.done{opacity:.7;}
  .todo-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);margin-top:3px;flex-wrap:wrap;}
  .todo-proj{background:var(--bg-muted);color:var(--text-soft);padding:0 7px;border-radius:4px;font-weight:600;}
  .todo-due strong{color:var(--text);font-weight:600;}
  .empty-today{color:var(--text-muted);text-align:center;padding:54px 0;font-size:14px;}

  /* report view */
  .report-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;color:var(--text-soft);font-size:13px;}
  .report-controls .seg{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:6px;}
  .rp-person{border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden;}
  .rp-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg-soft);font-weight:700;font-size:14px;border-bottom:1px solid var(--border);}
  .rp-head .cnt{margin-left:auto;font-size:12px;font-weight:500;color:var(--text-muted);}
  .rp-sub{font-size:11px;color:var(--text-muted);font-weight:700;padding:8px 14px 2px;}
  .rp-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border);font-size:13px;}
  .rp-item .mark{width:14px;flex:none;color:var(--text-muted);text-align:center;font-weight:700;}
  .rp-item .rp-name{flex:1;min-width:0;cursor:pointer;}
  .rp-item .rp-name:hover{text-decoration:underline;}
  .rp-item .rp-proj{font-size:11px;color:var(--text-soft);background:var(--bg-muted);padding:0 7px;border-radius:4px;font-weight:600;white-space:nowrap;}
  .rp-item .rp-date{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pr{font-size:12px;font-weight:600;white-space:nowrap;color:var(--text-soft);}
  .pr-높음,.pr-보통,.pr-낮음{color:var(--text-soft);}
  .who-chip{font-size:11px;color:var(--text-soft);}

  /* kanban */
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  .kcol{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:120px;}
  .kcol-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 2px;}
  .kcol-head .kcount{font-size:11px;color:var(--text-muted);background:var(--bg-muted);padding:1px 7px;border-radius:20px;}
  .kcol.dragover{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-soft);}
  .kcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:10px;box-shadow:var(--shadow);cursor:grab;}
  .kcard:active{cursor:grabbing;}
  .kcard.dragging{opacity:.4;}
  .kcard .kc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .kcard .kc-proj{font-size:11px;font-weight:600;color:var(--text-soft);background:var(--bg-muted);padding:1px 8px;border-radius:4px;}
  .kcard .kc-name{font-weight:600;font-size:13.5px;margin-bottom:6px;line-height:1.35;}
  .kcard .kc-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);}
  .kcard .kc-meta .who{display:inline-flex;align-items:center;gap:4px;}
  .avset{display:inline-flex;align-items:center;gap:2px;}
  .avatar{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;}
  .empty{color:var(--text-muted);text-align:center;padding:40px 0;font-size:13px;}

  /* modal */

<script>
const STORAGE_KEY = 'schedule-board-v2';
const STATUSES = ['대기','진행중','완료'];
let state = { tasks: [], projects: [], people: [], peopleColors:{}, projectLinks:{}, view:'list', lastBoardView:'list', collapsed:{}, expanded:{}, statusTab:'', search:'', filterProject:'', filterAssignee:'', sort:'priority', editingId:null, pendingParent:null, newRowId:null, showOngoing:false, reportFrom:'', reportTo:'', todayDone:{} };

/* ---------- 공용 다이얼로그 (prompt/confirm/alert 대체) ---------- */
function openDlg(message, withInput, def, okLabel, showCancel){
  return new Promise(resolve=>{
    const ov=document.getElementById('dlg-overlay');
    document.getElementById('dlg-msg').textContent=message;
    const inp=document.getElementById('dlg-input');
    inp.style.display=withInput?'block':'none';
    if(withInput) inp.value=def||'';
    const ok=document.getElementById('dlg-ok'), cancel=document.getElementById('dlg-cancel');
    ok.textContent=okLabel||'확인';
    cancel.style.display=showCancel?'inline-flex':'none';
    ov.classList.add('open');
    if(withInput) setTimeout(()=>{ inp.focus(); inp.select(); },40); else setTimeout(()=>ok.focus(),40);
    function done(val){ ov.classList.remove('open'); ok.onclick=cancel.onclick=ov.onclick=inp.onkeydown=null; resolve(val); }
    ok.onclick=()=>done(withInput?inp.value:true);
    cancel.onclick=()=>done(withInput?null:false);
    ov.onclick=e=>{ if(e.target===ov) done(withInput?null:false); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); done(inp.value); } else if(e.key==='Escape'){ e.preventDefault(); done(null); } };
  });
}
function uiPrompt(message, def){ return openDlg(message, true, def, '확인', true); }
function uiConfirm(message){ return openDlg(message, false, '', '확인', true); }
function uiAlert(message){ return openDlg(message, false, '', '확인', false); }

/* ---------- persistence ---------- */
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const d=JSON.parse(raw); state.tasks=d.tasks||[]; state.collapsed=d.collapsed||{}; state.expanded=d.expanded||{}; state.projects=d.projects||[]; state.people=d.people||[]; state.projectLinks=d.projectLinks||{}; state.peopleColors=d.peopleColors||{}; }
    else { seedFromSheet(); }
  }catch(e){ state.tasks=[]; }
  migrate();
  if(!state.projects.length) state.projects = projectsFromTasks();
  if(!state.people.length) state.people = peopleFromTasks();
  assignAllColors();
}
function peopleFromTasks(){
  const seen=[]; state.tasks.slice().sort((a,b)=>(a.order||0)-(b.order||0))
    .forEach(t=>{ (t.assignee||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{ if(!seen.includes(p)) seen.push(p); }); });
  return seen;
}
function allPeople(){ const out=[...state.people]; peopleFromTasks().forEach(p=>{ if(!out.includes(p)) out.push(p); }); return out; }
function migrate(){
  // 구버전 상태값 '대기중'/'진행예정' → '대기', 날짜 표기 정규화
  state.tasks.forEach(t=>{
    if(t.status==='대기중'||t.status==='진행예정') t.status='대기';
    t.start=toISODate(t.start); t.end=toISODate(t.end);
  });
}
function projectsFromTasks(){
  const seen=[]; state.tasks.slice().sort((a,b)=>(a.order||0)-(b.order||0))
    .forEach(t=>{ if(t.project && !seen.includes(t.project)) seen.push(t.project); });
  return seen;
}
function seedFromSheet(){
  const seed = (window.SEED_TASKS||[]).map(t=>JSON.parse(JSON.stringify(t)));
  state.tasks = seed;
  seed.forEach(t=>{ if(!t.parentId) state.expanded[t.id]=true; });
  state.projects = projectsFromTasks();
  state.people = peopleFromTasks();
  save();
}
function save(opts){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks:state.tasks,projects:state.projects,people:state.people,peopleColors:state.peopleColors,projectLinks:state.projectLinks,collapsed:state.collapsed,expanded:state.expanded}));
  if(!(opts&&opts.noSync)) scheduleSync();
}
function uid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- helpers ---------- */
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function byId(id){ return state.tasks.find(t=>t.id===id); }
function prRank(p){ return p==='높음'?0:p==='보통'?1:p==='낮음'?3:2; } // 높음>보통>미지정>낮음
function cmpTask(a,b){
  if(state.sort==='recent') return (b.order||0)-(a.order||0);
  if(state.sort==='old') return (a.order||0)-(b.order||0);
  return prRank(a.priority)-prRank(b.priority) || (a.order||0)-(b.order||0); // 우선순위순(기본)
}
function childrenOf(id){ return state.tasks.filter(t=>t.parentId===id).sort(cmpTask); }
function topLevel(){ return state.tasks.filter(t=>!t.parentId || !byId(t.parentId)).sort(cmpTask); }
function descendants(id){ let out=[]; childrenOf(id).forEach(c=>{ out.push(c); out=out.concat(descendants(c.id)); }); return out; }
function projColor(name){ let h=0; name=name||''; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return `hsl(${Math.abs(h)%360} 55% 48%)`; }
function initials(name){ return (name||'').trim().slice(0,2)||'–'; }
/* 담당자 아바타: 단일 이니셜 + 고유 배경색(중복 금지). 찰스/안나는 고정. */
const RESERVED_AV = { '찰스':{letter:'C',color:'#2563eb',fg:'#fff'}, '안나':{letter:'A',color:'#facc15',fg:'#1f2937'} };
const AV_PALETTE = ['#16a34a','#dc2626','#9333ea','#0891b2','#db2777','#ea580c','#0d9488','#7c3aed','#65a30d','#c2410c','#0369a1','#be123c','#4d7c0f','#a21caf'];
function usedColors(){ const s=new Set(); Object.values(RESERVED_AV).forEach(o=>s.add(o.color)); Object.values(state.peopleColors).forEach(c=>s.add(c)); return s; }
function ensurePersonColor(name){
  name=(name||'').trim();
  if(!name || RESERVED_AV[name] || state.peopleColors[name]) return;
  const used=usedColors();
  let c=AV_PALETTE.find(x=>!used.has(x));
  if(!c){ let i=0; do{ c=`hsl(${(i*53+17)%360} 60% 45%)`; i++; }while(used.has(c) && i<400); }
  state.peopleColors[name]=c;
}
function assignAllColors(){ allPeople().forEach(ensurePersonColor); }
function avatarInfo(name){
  name=(name||'').trim();
  if(RESERVED_AV[name]) return RESERVED_AV[name];
  ensurePersonColor(name);
  let letter=name?name[0]:'?'; if(/[a-z]/i.test(letter)) letter=letter.toUpperCase();
  return { letter, color: state.peopleColors[name]||'#a1a1aa', fg:'#fff' };
}
function avatarsHtml(assignee){
  const ps=(assignee||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!ps.length) return '';
  return '<span class="avset">'+ps.map(p=>{ const a=avatarInfo(p); return `<span class="avatar" style="background:${a.color};color:${a.fg}" title="${esc(p)}">${esc(a.letter)}</span>`; }).join('')+'</span>';
}
function progressOf(id){ const d=descendants(id); if(!d.length) return null; const done=d.filter(x=>x.status==='완료').length; return {done,total:d.length,pct:Math.round(done/d.length*100)}; }
function docCell(doc){ if(!doc) return '–'; if(/^https?:\/\//i.test(doc)) return `<a class="doc-link" href="${esc(doc)}" target="_blank" onclick="event.stopPropagation()">열기 ↗</a>`; return `<span class="muted">${esc(doc)}</span>`; }
function docCellEditable(t){
  const has=t.doc && /^https?:\/\//i.test(t.doc);
  const link = has ? `<a class="doc-link" href="${esc(t.doc)}" target="_blank" onclick="event.stopPropagation()">열기 ↗</a>`
                   : (t.doc?`<span class="muted">${esc(t.doc)}</span>`:'');
  const btn = `<button class="doc-edit" title="결과물/문서 링크" onclick="event.stopPropagation();editDoc('${t.id}')">${t.doc?'✎':'＋ 링크'}</button>`;
  return `<span class="doc-cell">${link}${btn}</span>`;
}
async function editDoc(id){
  const t=byId(id); if(!t) return;
  const u=await uiPrompt('결과물/문서 링크(URL)를 입력하세요. (비우면 삭제)', t.doc||'');
  if(u===null) return;
  t.doc=u.trim(); save(); renderList();
}
/* 날짜 정규화/표기 */
function toISODate(v){
  if(v==null||v==='') return '';
  if(v instanceof Date) return fmtDate(v);
  const s=String(v).trim();
  const m=s.match(/^(\d{4})[-./]\s*(\d{1,2})[-./]\s*(\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  const d=new Date(s);
  return isNaN(d)?'':fmtDate(d);
}
function fmtK(v){ const s=toISODate(v); return s? s.replace(/-/g,'.') : ''; }

/* ---------- filtering (tree-aware) ---------- */
function matchBasic(t){
  const q=(state.search||'').trim().toLowerCase();
  if(state.filterProject && t.project!==state.filterProject) return false;
  if(state.filterAssignee && !(t.assignee||'').includes(state.filterAssignee)) return false;
  if(q){ const hay=(t.task+' '+t.project+' '+t.assignee+' '+t.category+' '+t.progress+' '+t.issue).toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}
function matchTask(t){
  if(!matchBasic(t)) return false;
  if(state.statusTab && (t.status||'대기')!==state.statusTab) return false;
  return true;
}
function hasFilter(){ return (state.search||'').trim() || state.filterProject || state.filterAssignee || state.statusTab; }
function activeFilterCount(){ let n=0; if(state.filterProject)n++; if(state.filterAssignee)n++; if(state.sort!=='priority')n++; return n; }
/* ---------- 상단 컨트롤(뷰 active / 필터 배지) ---------- */
function updateChrome(){
  const v=state.view, board=(v==='list'||v==='kanban');
  document.getElementById('tab-list').classList.toggle('active', v==='list');
  document.getElementById('tab-kanban').classList.toggle('active', v==='kanban');
  document.getElementById('nav-board').classList.toggle('active', board);
  document.getElementById('nav-today').classList.toggle('active', v==='today');

async function renameProject(old){
  const name=await uiPrompt('프로젝트 이름을 수정하세요.', old);
  if(name===null) return;
  const n=name.trim();
  if(!n || n===old) return;
  const merge = (state.projects.includes(n) || state.tasks.some(t=>t.project===n));
  if(merge && !(await uiConfirm(`'${n}' 프로젝트가 이미 있습니다. 합칠까요?`))) return;
  state.tasks.forEach(t=>{ if(t.project===old) t.project=n; });
  state.projects = [...new Set(state.projects.map(p=>p===old?n:p))];
  if(!state.projects.includes(n)) state.projects.push(n);
  if(state.projectLinks[old]){ if(!state.projectLinks[n]) state.projectLinks[n]=state.projectLinks[old]; delete state.projectLinks[old]; }
  if(old in state.collapsed){ state.collapsed[n]=state.collapsed[old]; delete state.collapsed[old]; }
  save(); render();
}

/* ---------- today (투데이 투두) ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function addDaysStr(s,n){ const d=new Date(s); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function computeToday(){
  const T=todayStr(), WEEK=addDaysStr(T,7);
  const over=[],today=[],doing=[],soon=[];
  state.tasks.filter(t=>matchBasic(t)).forEach(t=>{
    const st=t.status||'대기';
    const done = st==='완료';
    if(done && !(t.id in state.todayDone)) return; // 완료는 방금 체크한 것만 유지
    const s=t.start||'', e=t.end||'';
    if(e && e<T){ over.push(t); }
    else if(e===T || s===T || (s && e && s<=T && e>=T)){ today.push(t); }
    else if(st==='진행중' || done){ doing.push(t); }
    else if(s && s>T && s<=WEEK){ soon.push(t); }
  });
  return {over,today,doing,soon};
}
function renderToday(){
  const T=todayStr();
  const wd=['일','월','화','수','목','금','토'][new Date().getDay()];
  const {over,today,doing,soon}=computeToday();
  let html=`<div class="today-head">
    <span class="sub">${T.replace(/-/g,'. ')} (${wd}) 기준</span>
  </div>
  <div class="today-stats">
    <div class="stat"><div class="n">${over.length}</div><div class="l">지연</div></div>
    <div class="stat"><div class="n">${today.length}</div><div class="l">오늘 마감/진행</div></div>
    <div class="stat"><div class="n">${soon.length}</div><div class="l">이번 주 예정</div></div>
    <div class="stat"><div class="n">${doing.length}</div><div class="l">진행 중(기한 미정)</div></div>
  </div>`;
  const sections=[
    ['지연 (기한 지남)',over,true],
    ['오늘 할 일',today,false],
    ['이번 주 예정',soon,false],
  ];
  let any=false;
  sections.forEach(([title,items,isOver])=>{
    if(!items.length) return; any=true;
    items.sort(cmpTask);
    html+=`<div class="todo-section"><h3>${title}<span class="c">${items.length}</span></h3><div class="todo-list">`;
    items.forEach(t=>{ html+=todoItem(t,T,isOver); });
    html+=`</div></div>`;
  });
  if(!any && !doing.length) html+=`<div class="empty-today">🎉 오늘 처리할 일정 기반 업무가 없습니다.</div>`;
  // 기한 미정 진행 중: 기본 접힘
  if(doing.length){
    doing.sort(cmpTask);
    const open=state.showOngoing;
    html+=`<div class="todo-section">
      <h3 style="cursor:pointer" onclick="state.showOngoing=!state.showOngoing;renderToday()">
        <span style="color:var(--text-muted);font-size:11px">${open?'▼':'▶'}</span>
        진행 중 · 기한 미정 <span class="c">${doing.length}</span></h3>`;
    if(open){ html+=`<div class="todo-list">`; doing.forEach(t=>{ html+=todoItem(t,T,false); }); html+=`</div>`; }
    html+=`</div>`;
  }
  document.getElementById('today-view').innerHTML=html;
}
function toggleTodayDone(id,checked){
  const t=byId(id); if(!t) return;
  if(checked){ state.todayDone[id]=t.status||'대기'; t.status='완료'; }
  else { t.status=state.todayDone[id]||'진행중'; delete state.todayDone[id]; }
  save(); updateChrome(); renderToday();
}
function todoItem(t,T,isOver){
  let due='';
  if(t.end){
    if(isOver){ const n=daysBetween(t.end,T); due=`<span class="todo-due">마감 ${esc(fmtK(t.end))} <strong>(${n}일 지남)</strong></span>`; }
    else if(t.end===T){ due=`<span class="todo-due"><strong>오늘 마감</strong></span>`; }
    else { due=`<span class="todo-due">~ ${esc(fmtK(t.end))}</span>`; }
  } else if(t.start===T){ due=`<span class="todo-due"><strong>오늘 시작</strong></span>`; }
  const done=(t.status||'')==='완료';
  return `<div class="todo-item${done?' done':''}">
    <input type="checkbox" title="완료 처리" ${done?'checked':''} onchange="toggleTodayDone('${t.id}',this.checked)">
    <div class="todo-main">
      <span class="todo-name" onclick="openModal('${t.id}')">${esc(t.task)||'(제목 없음)'}</span>
      <div class="todo-meta">
        <span class="todo-proj">${esc(t.project)}</span>
        ${t.assignee?`<span>👤 ${esc(t.assignee)}</span>`:''}
        ${t.category?`<span>${esc(t.category)}</span>`:''}
        ${due}
      </div>
    </div>
  </div>`;
}

/* ---------- 성과 리포트 ---------- */
function fmtDate(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; } // 월요일
function ensureReportRange(){
  if(!state.reportFrom||!state.reportTo){
    const mon=startOfWeek(new Date()); const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    state.reportFrom=fmtDate(mon); state.reportTo=fmtDate(sun);
  }
}
function setReportFrom(v){ state.reportFrom=v; renderReport(); }
function setReportTo(v){ state.reportTo=v; renderReport(); }
function reportPreset(kind){
  const now=new Date();
  if(kind==='thisweek'){ const m=startOfWeek(now); const s=new Date(m); s.setDate(m.getDate()+6); state.reportFrom=fmtDate(m); state.reportTo=fmtDate(s); }
  else if(kind==='lastweek'){ const m=startOfWeek(now); m.setDate(m.getDate()-7); const s=new Date(m); s.setDate(m.getDate()+6); state.reportFrom=fmtDate(m); state.reportTo=fmtDate(s); }
  else if(kind==='7days'){ const s=new Date(now); s.setDate(now.getDate()-6); state.reportFrom=fmtDate(s); state.reportTo=fmtDate(now); }
  else if(kind==='month'){ state.reportFrom=fmtDate(new Date(now.getFullYear(),now.getMonth(),1)); state.reportTo=fmtDate(new Date(now.getFullYear(),now.getMonth()+1,0)); }
  renderReport();
}
function renderReport(){
  ensureReportRange();
  const from=state.reportFrom, to=state.reportTo;
  const inRange=d=> d && d>=from && d<=to;
  const overlaps=(s,e)=> (s||e) && (!s||s<=to) && (!e||e>=from);
  const pool=state.tasks.filter(t=>matchBasic(t));
  const personsOf=t=>(t.assignee||'').split(',').map(s=>s.trim()).filter(Boolean);
  const doneAll=pool.filter(t=>t.status==='완료' && inRange(t.end));
  const rows=allPeople().map(p=>{
    const mine=pool.filter(t=>personsOf(t).includes(p));
    const completed=mine.filter(t=>t.status==='완료' && inRange(t.end)).sort((a,b)=>(a.end<b.end?1:-1));
    const active=mine.filter(t=>t.status==='진행중' && overlaps(t.start,t.end)).sort(cmpTask);
    return {p,completed,active};
  }).filter(r=>r.completed.length||r.active.length)
    .sort((a,b)=>b.completed.length-a.completed.length || b.active.length-a.active.length);

  let html=`<div class="today-head">
    <span class="sub">${fmtK(from)} ~ ${fmtK(to)}</span>
  </div>
  <div class="report-controls">
    <input type="date" value="${esc(from)}" onchange="setReportFrom(this.value)"> ~
    <input type="date" value="${esc(to)}" onchange="setReportTo(this.value)">
    <span class="seg">
      <button class="btn btn-ghost btn-sm" onclick="reportPreset('thisweek')">이번 주</button>
      <button class="btn btn-ghost btn-sm" onclick="reportPreset('lastweek')">지난 주</button>
      <button class="btn btn-ghost btn-sm" onclick="reportPreset('7days')">최근 7일</button>
      <button class="btn btn-ghost btn-sm" onclick="reportPreset('month')">이번 달</button>
    </span>
  </div>
  <div class="today-stats">
    <div class="stat"><div class="n">${doneAll.length}</div><div class="l">완료(기간)</div></div>
    <div class="stat"><div class="n">${rows.length}</div><div class="l">참여 인원</div></div>
  </div>`;

  if(!rows.length){ html+=`<div class="empty-today">해당 기간에 완료/진행한 업무가 없습니다.</div>`; document.getElementById('report-view').innerHTML=html; return; }

  rows.forEach(r=>{
    html+=`<div class="rp-person">
      <div class="rp-head">${avatarsHtml(r.p)}${esc(r.p)}
        <span class="cnt">완료 ${r.completed.length} · 진행 ${r.active.length}</span></div>`;
    if(r.completed.length){
      html+=`<div class="rp-sub">완료</div>`;
      r.completed.forEach(t=>{ html+=rpItem(t,'✓',fmtK(t.end)); });
    }
    if(r.active.length){
      html+=`<div class="rp-sub">진행 중</div>`;
      r.active.forEach(t=>{ html+=rpItem(t,'·',t.end?('~ '+fmtK(t.end)):''); });
    }
    html+=`</div>`;
  });
  document.getElementById('report-view').innerHTML=html;
}
function rpItem(t,mark,dateLabel){
  const docLink = (t.doc && /^https?:\/\//i.test(t.doc))
    ? `<a class="rp-doc" href="${esc(t.doc)}" target="_blank" onclick="event.stopPropagation()">결과물 ↗</a>` : '';
  return `<div class="rp-item">
    <span class="mark">${mark}</span>
    <span class="rp-name" onclick="openModal('${t.id}')">${esc(t.task)||'(제목 없음)'}</span>
    <span class="rp-proj">${esc(t.project)}</span>
    ${docLink}
    ${dateLabel?`<span class="rp-date">${esc(dateLabel)}</span>`:''}
  </div>`;
}

/* ---------- modal ---------- */
function openModal(id){
  state.editingId=id||null; state.pendingParent=null;
  const t=id?byId(id):null;
  document.getElementById('modal-title').textContent=t?'작업 편집':'작업 추가';
  document.getElementById('m-delete').style.display=t?'inline-flex':'none';
  const pb=document.getElementById('parent-banner');
  const parent=t&&t.parentId?byId(t.parentId):null;
  if(parent){ pb.classList.add('show'); pb.innerHTML=`상위 작업: <b>${esc(parent.task)}</b> (${esc(parent.project)})`; }
  else pb.classList.remove('show');
  const v=(f,val)=>document.getElementById(f).value=val||'';
  v('m-task',t?.task); v('m-project',t?.project); v('m-category',t?.category); renderAssigneeBox(t?t.assignee:'');
  v('m-priority',t?.priority||''); v('m-start',t?.start); v('m-end',t?.end); v('m-status',t?.status||'대기');
  v('m-doc',t?.doc); v('m-progress',t?.progress); v('m-issue',t?.issue);
  renderSubsSection(id);
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('m-task').focus(),50);
}
function openSub(parentId){
  const parent=byId(parentId);
  state.editingId=null; state.pendingParent=parentId;
  document.getElementById('modal-title').textContent='하위 작업 추가';
  document.getElementById('m-delete').style.display='none';
  const pb=document.getElementById('parent-banner');
  pb.classList.add('show'); pb.innerHTML=`상위 작업: <b>${esc(parent.task)}</b> (${esc(parent.project)})`;
  const v=(f,val)=>document.getElementById(f).value=val||'';
  v('m-task',''); v('m-project',parent.project); v('m-category',parent.category); renderAssigneeBox(parent.assignee);
  v('m-priority',''); v('m-start',''); v('m-end',''); v('m-status','대기'); v('m-doc',''); v('m-progress',''); v('m-issue','');
  document.getElementById('subs-section').style.display='none';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('m-task').focus(),50);
}
function addSubFromModal(){ if(state.editingId) openSub(state.editingId); }
function renderAssigneeBox(str){
  const sel=(str||'').split(',').map(s=>s.trim()).filter(Boolean);
  const box=document.getElementById('m-assignee-box');
  box.innerHTML = allPeople().map(p=>
    `<label class="${sel.includes(p)?'on':''}"><input type="checkbox" value="${esc(p)}" ${sel.includes(p)?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)"> ${esc(p)}</label>`).join('')
    + `<span class="addp" onclick="addPersonModal()">＋ 담당자</span>`;
}
function getModalAssignees(){
  const order=allPeople();
  return [...document.querySelectorAll('#m-assignee-box input:checked')].map(c=>c.value)
    .sort((a,b)=>order.indexOf(a)-order.indexOf(b)).join(', ');
}
async function addPersonModal(){
  const name=await uiPrompt('새 담당자 이름','');
  if(name===null) return;
  const n=name.trim(); if(!n) return;
  if(!state.people.includes(n)) state.people.push(n);
  ensurePersonColor(n);
  const sel=getModalAssignees().split(',').map(s=>s.trim()).filter(Boolean);
  if(!sel.includes(n)) sel.push(n);
  renderAssigneeBox(sel.join(', '));
}
function renderSubsSection(id){
  const sec=document.getElementById('subs-section');
  if(!id){ sec.style.display='none'; return; }
  const kids=childrenOf(id);
  sec.style.display='block';
  document.getElementById('subs-count').textContent=`(${kids.length})`;
  const el=document.getElementById('subs-list');
  el.innerHTML = kids.length ? kids.map(c=>`<div class="sub-item" onclick="openModal('${c.id}')">
      <span class="badge st-${c.status||'대기'}"><span class="bdot"></span>${esc(c.status||'대기')}</span>
      <span class="s-name">${esc(c.task)}</span>
      <span class="who-chip">${esc(c.assignee)||''}</span>
    </div>`).join('') : '<div class="muted" style="font-size:12px;padding:4px 8px">하위 작업이 없습니다.</div>';
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); state.editingId=null; state.pendingParent=null; }
function saveTask(){
  const g=f=>document.getElementById(f).value.trim();
  const task=g('m-task'), project=g('m-project');
  if(!task||!project){ uiAlert('진행업무와 프로젝트는 필수입니다.'); return; }
  const data={ task,project,category:g('m-category'),assignee:getModalAssignees(),priority:g('m-priority'),
    start:g('m-start'),end:g('m-end'),status:g('m-status'),doc:g('m-doc'),progress:g('m-progress'),issue:g('m-issue') };
  if(state.editingId){ Object.assign(byId(state.editingId),data); }
  else{
    const t={ id:uid(), parentId:state.pendingParent||null, order:Date.now(), ...data };
    state.tasks.push(t);
    if(t.parentId) state.expanded[t.parentId]=true;
  }
  save(); closeModal(); render();
}
async function deleteTask(){
  if(!state.editingId) return;
  const kids=descendants(state.editingId);
  const msg=kids.length?`이 작업과 하위 ${kids.length}건을 모두 삭제할까요?`:'이 작업을 삭제할까요?';
  if(!(await uiConfirm(msg))) return;
  const ids=new Set([state.editingId,...kids.map(k=>k.id)]);
  state.tasks=state.tasks.filter(t=>!ids.has(t.id));
  save(); closeModal(); render();
}

/* ---------- import / export / reset ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({tasks:state.tasks},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='schedule-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.tasks)) throw 0;
      state.tasks=d.tasks.map(t=>({id:t.id||uid(),order:t.order||Date.now(),parentId:t.parentId||null,...t}));
      save(); render(); uiAlert('가져오기 완료 ('+state.tasks.length+'건)');
    }catch(e){ uiAlert('올바른 JSON 파일이 아닙니다.'); } ev.target.value=''; };
  r.readAsText(file);
}
async function resetToSheet(){
  if(!(await uiConfirm('현재 데이터를 지우고 구글 시트 원본 데이터로 초기화할까요?'))) return;
  state.collapsed={}; state.expanded={}; state.projects=[]; seedFromSheet(); state.projects=projectsFromTasks(); save(); render();
}

/* ---------- 프로젝트 등록 ---------- */
async function addProject(){
  const name=await uiPrompt('새 프로젝트 이름을 입력하세요','');
  if(name===null) return;
  const n=name.trim();
  if(!n) return;
  if(state.projects.includes(n)){ uiAlert('이미 등록된 프로젝트입니다.'); return; }
  state.projects.unshift(n); state.collapsed[n]=false; save(); render();
}
function openNewInProject(proj){
  openModal();
  document.getElementById('m-project').value = proj;
  document.getElementById('m-task').focus();
}

/* ---------- 보드 제목 편집 ---------- */
const TITLE_KEY='schedule-board-title';
function loadTitle(){
  const el=document.getElementById('board-title');
  const t=localStorage.getItem(TITLE_KEY)||'프로젝트 스케줄 보드';
  if(el) el.innerText=t; document.title=t;
}
function saveTitle(text){
  if(state.view!=='list'&&state.view!=='kanban') return; // 보드에서만 제목 편집 저장
  let t=(text||'').replace(/\s+/g,' ').trim();
  if(!t){ t='프로젝트 스케줄 보드'; const el=document.getElementById('board-title'); if(el) el.innerText=t; }
  localStorage.setItem(TITLE_KEY,t); document.title=t;
  scheduleSync();   // 제목도 시트(meta)에 공유
}

/* ---------- 구글 시트 동기화 ---------- */
const SYNC_KEY='schedule-sync-url';
function getSyncUrl(){ return localStorage.getItem(SYNC_KEY)||''; }
function setSyncStatus(msg){ const el=document.getElementById('sync-status'); if(el) el.textContent=msg||''; }
function updateSyncUI(){ const b=document.getElementById('pm-pull'); if(b) b.style.display=getSyncUrl()?'block':'none'; }
function nowt(){ return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
let _pushTimer=null;
function scheduleSync(){ if(!getSyncUrl()) return; clearTimeout(_pushTimer); setSyncStatus('저장 중…'); _pushTimer=setTimeout(pushToSheet,800); }
function buildMeta(){ return { projects: state.projects||[], projectLinks: state.projectLinks||{}, peopleColors: state.peopleColors||{}, title: localStorage.getItem(TITLE_KEY)||'' }; }
function pushToSheet(){
  const url=getSyncUrl(); if(!url) return;
  // text/plain 본문 → 프리플라이트(OPTIONS) 없이 전송 (Apps Script CORS 회피)
  return fetch(url,{method:'POST',body:JSON.stringify({tasks:state.tasks, meta:buildMeta()})})
    .then(r=>r.json())
    .then(d=>setSyncStatus(d&&d.ok?('시트 동기화됨 · '+nowt()):'동기화 응답 오류'))
    .catch(()=>setSyncStatus('동기화 실패(네트워크)'));
}
function pullFromSheet(opts){
  const url=getSyncUrl(); if(!url){ openSyncSettings(); return; }
  setSyncStatus('불러오는 중…');
  return fetch(url).then(r=>r.json()).then(d=>{
    if(!d||!Array.isArray(d.tasks)) throw 0;
    if(d.tasks.length===0 && opts && opts.seedIfEmpty){ setSyncStatus('시트가 비어 현재 데이터를 업로드…'); return pushToSheet(); }
    state.tasks=d.tasks.map(t=>({parentId:t.parentId||null, order:Number(t.order)||0, ...t}));
    if(d.meta){
      if(d.meta.projectLinks) state.projectLinks=d.meta.projectLinks;
      if(d.meta.peopleColors) state.peopleColors=d.meta.peopleColors;
      if(d.meta.title){ localStorage.setItem(TITLE_KEY,d.meta.title); loadTitle(); }
    }
    migrate();
    const metaProjects=(d.meta && Array.isArray(d.meta.projects))?d.meta.projects:[];
    state.projects=[...new Set([...metaProjects, ...projectsFromTasks()])]; // 빈 프로젝트도 유지
    state.people=peopleFromTasks(); assignAllColors();
    state.expanded={}; state.tasks.forEach(t=>{ if(!t.parentId) state.expanded[t.id]=true; });
    save({noSync:true}); render(); setSyncStatus('시트에서 불러옴 · '+nowt());
  }).catch(()=>setSyncStatus('불러오기 실패 (URL/배포 확인)'));
}
async function openSyncSettings(){
  const cur=getSyncUrl();
  const u=await uiPrompt('Google Apps Script 웹앱 URL( .../exec )을 붙여넣으세요.\n(비우고 확인하면 공유 해제)', cur);
  if(u===null) return;
  const url=u.trim();
  if(!url){ localStorage.removeItem(SYNC_KEY); updateSyncUI(); setSyncStatus('공유 해제됨'); return; }
  if(!/^https:\/\/script\.google\.com\/macros\/.+\/exec\b/.test(url)){
    if(!(await uiConfirm('일반적인 Apps Script 웹앱 주소(.../exec) 형식이 아닙니다. 그래도 연결할까요?'))) return;
  }
  localStorage.setItem(SYNC_KEY,url); updateSyncUI(); setSyncStatus('연결 확인 중…');
  pullFromSheet({seedIfEmpty:true});
}

/* ---------- init ---------- */
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('click',e=>{ closeAssigneeMenu(); if(!e.target.closest('.pop-wrap')) hideMenus(); });   // 메뉴 바깥 클릭 시에만 닫기
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('dlg-overlay').classList.contains('open')) return; // 다이얼로그는 자체 처리
  closeAssigneeMenu(); closeModal();
});
loadTitle(); load(); updateSyncUI(); setView(state.view);
if(getSyncUrl()) pullFromSheet();   // 공유 연결돼 있으면 시트 데이터로 갱신
</script>
